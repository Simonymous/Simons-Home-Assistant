
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
timer:
  ladesaeule_parkplatz:
    name: Ladesäule Parkplatz
    duration: "02:50:00"
paket_tracking:
media_player:
  - platform: universal
    name: "Lautsprecher Wohnzimmer"
    unique_id: lautsprecher_wohnzimmer_media_player
    device_class: receiver
    attributes:
      state: binary_sensor.receiver_an
      is_volume_muted: input_boolean.lautsprecher_stumm_angenommen
    commands:
      turn_on:
        action: script.lautsprecher_einschalten
      turn_off:
        action: script.lautsprecher_ausschalten
      volume_up:
        action: script.lautsprecher_lauter
      volume_down:
        action: script.lautsprecher_leiser
      volume_mute:
        action: script.lautsprecher_stumm_setzen
        data:
          is_volume_muted: "{{ is_volume_muted }}"
logger:
  logs:
    custom_components.paket_tracking: debug
    custom_components.philips_sonicare_ble: debug
lovelace:
  dashboards:
    dashboard-reinigung:
      mode: yaml
      filename: dashboards/status_dashboard.yaml
      title: Status Dashboard
      icon: mdi:clipboard-check-outline
      show_in_sidebar: true
      require_admin: false
homeassistant:
  media_dirs:
    local: /media
input_datetime:
  letzter_synology_download:
    name: Letzter Synology Download
    has_date: true
    has_time: true
  letzter_lauf_spulmaschine:
    name: Letzter Lauf Spülmaschine
    has_date: true
    has_time: true
  letzter_lauf_waschmaschine:
    name: Letzter Lauf Waschmaschine
    has_date: true
    has_time: true
  letzter_lauf_trockner:
    name: Letzter Lauf Trockner
    has_date: true
    has_time: true
  letzte_bewegung_flur:
    name: Letzte Bewegung Flur
    has_date: true
    has_time: true
  letztes_aufschliessen_wohnung:
    name: Letztes Aufschließen Wohnungsschloss
    has_date: true
    has_time: true

template:
  - sensor:
      # Liest das naechste Abholdatum direkt aus den Attributen der
      # waste_collection_schedule UI-Sensoren (deren "state" ist nur ein
      # Anzeigetext wie "on Mi, 15.07.2026", kein Tage-Zaehler) und rechnet
      # daraus die Tage bis zur Abholung aus.
      - name: "Restabfall Tage bis Abholung"
        unique_id: restabfall_tage_bis_abholung
        unit_of_measurement: "d"
        state: >-
          {% set meta_keys = ['icon', 'friendly_name', 'attribution', 'device_class', 'unit_of_measurement', 'state_class'] %}
          {% set st = states['sensor.waste_collection_schedule_restabfalltonne'] %}
          {% set dates = (st.attributes.keys() | reject('in', meta_keys) | list | sort) if st else [] %}
          {{ (strptime(dates[0], '%Y-%m-%d').date() - now().date()).days if dates else 99 }}

      - name: "Biotonne Tage bis Abholung"
        unique_id: biotonne_tage_bis_abholung
        unit_of_measurement: "d"
        state: >-
          {% set meta_keys = ['icon', 'friendly_name', 'attribution', 'device_class', 'unit_of_measurement', 'state_class'] %}
          {% set st = states['sensor.waste_collection_schedule_biotonne'] %}
          {% set dates = (st.attributes.keys() | reject('in', meta_keys) | list | sort) if st else [] %}
          {{ (strptime(dates[0], '%Y-%m-%d').date() - now().date()).days if dates else 99 }}

      - name: "Gelbe Tonne Tage bis Abholung"
        unique_id: gelbe_tonne_tage_bis_abholung
        unit_of_measurement: "d"
        state: >-
          {% set meta_keys = ['icon', 'friendly_name', 'attribution', 'device_class', 'unit_of_measurement', 'state_class'] %}
          {% set st = states['sensor.waste_collection_schedule_gelbe_tonne'] %}
          {% set dates = (st.attributes.keys() | reject('in', meta_keys) | list | sort) if st else [] %}
          {{ (strptime(dates[0], '%Y-%m-%d').date() - now().date()).days if dates else 99 }}

      - name: "Blaue Tonne Tage bis Abholung"
        unique_id: blaue_tonne_tage_bis_abholung
        unit_of_measurement: "d"
        state: >-
          {% set meta_keys = ['icon', 'friendly_name', 'attribution', 'device_class', 'unit_of_measurement', 'state_class'] %}
          {% set st = states['sensor.waste_collection_schedule_blaue_tonne'] %}
          {% set dates = (st.attributes.keys() | reject('in', meta_keys) | list | sort) if st else [] %}
          {{ (strptime(dates[0], '%Y-%m-%d').date() - now().date()).days if dates else 99 }}
  - lock:
      - name: "Haustuer Intercom"
        state: "locked" # Zeigt in Apple Home standardmäßig "Zugeschlossen" an
        lock:
          service: button.press
          target:
            entity_id: button.vordereingang_tur_offnen
        unlock:
          service: button.press
          target:
            entity_id: button.vordereingang_tur_offnen
  - binary_sensor:
      - name: "Gelbe Tonne rausstellen"
        unique_id: gelbe_tonne_rausstellen
        state: "{{ states('sensor.gelbe_tonne_tage_bis_abholung') | int(99) <= 1 }}"
        device_class: problem

      - name: "Blaue Tonne rausstellen"
        unique_id: blaue_tonne_rausstellen
        state: "{{ states('sensor.blaue_tonne_tage_bis_abholung') | int(99) <= 1 }}"
        device_class: problem

      - name: "Schwarze Tonne rausstellen"
        unique_id: schwarze_tonne_rausstellen
        state: "{{ states('sensor.restabfall_tage_bis_abholung') | int(99) <= 1 }}"
        device_class: problem

      - name: "Synology Download aktiv"
        unique_id: synology_download_aktiv
        icon: mdi:download-network
        device_class: running
        delay_off:
          minutes: 2
        # Gesamter eingehender NAS-Verkehr in kB/s, abgefragt ca. alle 15 min. DSM holt
        # jede Nacht gegen 5 Uhr Updates mit bis zu ~180 kB/s; die alte Schwelle von 50
        # meldete das als Download. Echte Downloads laufen mit mehreren MB/s.
        state: "{{ states('sensor.simon_synology_download_durchsatz') | float(0) > 1000 }}"

      - name: "Receiver an"
        unique_id: receiver_an
        icon: mdi:audio-video
        device_class: running
        state: "{{ states('sensor.tz3210_2putqrmw_ts011f_leistung') | float(0) > 5 }}"

  - trigger:
      - trigger: state
        entity_id: cover.schlafzimmer_links
        attribute: current_position
        id: change
      - trigger: state
        entity_id: cover.schlafzimmer_links
        attribute: current_position
        for:
          seconds: 3
        id: settled
    sensor:
      - name: "Rollo Links Bewegung"
        unique_id: rollo_links_bewegung
        state: >-
          {% if trigger.id == 'settled' %}ruht
          {% else %}
            {% set von = trigger.from_state.attributes.current_position if trigger.from_state else none %}
            {% set bis = trigger.to_state.attributes.current_position %}
            {% if von is none or bis == von %}ruht
            {% elif bis > von %}oeffnet
            {% else %}schliesst
            {% endif %}
          {% endif %}

  - trigger:
      - trigger: state
        entity_id: cover.schlafzimmer_rechts
        attribute: current_position
        id: change
      - trigger: state
        entity_id: cover.schlafzimmer_rechts
        attribute: current_position
        for:
          seconds: 3
        id: settled
    sensor:
      - name: "Rollo Rechts Bewegung"
        unique_id: rollo_rechts_bewegung
        state: >-
          {% if trigger.id == 'settled' %}ruht
          {% else %}
            {% set von = trigger.from_state.attributes.current_position if trigger.from_state else none %}
            {% set bis = trigger.to_state.attributes.current_position %}
            {% if von is none or bis == von %}ruht
            {% elif bis > von %}oeffnet
            {% else %}schliesst
            {% endif %}
          {% endif %}
  # --- Saugroboter Bob: Status und Fortschritt fuers Dashboard ---
  # Referenzflaeche des Werktagslaufs (Roborock-App, Mo-Fr 11:00, alle Raeume ausser
  # Buero/Schlafzimmer/Bad, ca. 33-34 m2). Wird nach jedem vollstaendigen Lauf
  # nachgefuehrt; trigger-basierte Sensoren behalten ihren Wert ueber Neustarts.
  - trigger:
      - trigger: state
        entity_id: sensor.bob_status
        to: returning_home
    sensor:
      - name: "Bob Fläche Werktagslauf"
        unique_id: bob_flaeche_werktagslauf
        unit_of_measurement: "m²"
        icon: mdi:texture-box
        state: >-
          {% set start = as_datetime(states('sensor.bob_letzter_reinigungsbeginn')) %}
          {% set start = as_local(start) if start else none %}
          {% set planmaessig = start is not none and start.weekday() < 5
             and start.hour == 11 and start.minute < 10 %}
          {% set flaeche = states('sensor.bob_reinigungsbereich') | float(0) %}
          {{ flaeche if planmaessig and flaeche > 25 else this.state | float(34) }}

  - sensor:
      - name: "Bob Reinigungsstatus"
        unique_id: bob_reinigungsstatus
        icon: mdi:robot-vacuum
        state: >-
          {% set s = states('sensor.bob_status') %}
          {% set raum = states('sensor.bob_aktueller_raum') %}
          {% set raum = raum if raum not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% if s in ['cleaning', 'segment_cleaning', 'zoned_cleaning', 'spot_cleaning'] %}
            {{ 'Reinigt ' ~ raum if raum else 'Reinigt' }}
          {% elif s == 'paused' %}{{ 'Pausiert in ' ~ raum if raum else 'Pausiert' }}
          {% elif s in ['returning_home', 'docking'] %}Fährt zur Station
          {% elif s == 'going_to_target' %}Fährt zum Ziel
          {% elif s == 'emptying_the_bin' %}Leert den Staubbehälter
          {% elif s in ['washing_the_mop', 'going_to_wash_the_mop'] %}Wäscht den Mopp
          {% elif s == 'charging' %}Lädt ({{ states('sensor.bob_batterie') }} %)
          {% elif s in ['idle', 'charging_complete', 'charger_disconnected'] %}Bereit
          {% elif s == 'error' %}Fehler: {{ states('sensor.bob_staubsauger_fehler') }}
          {% elif s in ['unavailable', 'unknown'] %}Nicht erreichbar
          {% else %}{{ s | replace('_', ' ') | capitalize }}
          {% endif %}

      # Nur waehrend des Werktagslaufs: gereinigte Flaeche im Verhaeltnis zur Referenz.
      # Gezielte Laeufe (Raeume aus der App) melden ihre Zielraeume nicht, dort gibt
      # es keinen Prozentwert.
      - name: "Bob Reinigungsfortschritt"
        unique_id: bob_reinigungsfortschritt
        unit_of_measurement: "%"
        icon: mdi:progress-check
        availability: >-
          {% set start = as_datetime(states('sensor.bob_letzter_reinigungsbeginn')) %}
          {% set start = as_local(start) if start else none %}
          {{ states('sensor.bob_status') in ['cleaning', 'segment_cleaning', 'paused',
               'washing_the_mop', 'going_to_wash_the_mop']
             and start is not none and start.weekday() < 5
             and start.hour == 11 and start.minute < 10
             and (now() - start).total_seconds() < 4 * 3600 }}
        state: >-
          {% set ref = states('sensor.bob_flache_werktagslauf') | float(34) %}
          {% set flaeche = states('sensor.bob_reinigungsbereich') | float(0) %}
          {{ [99, (flaeche / (ref if ref > 0 else 34) * 100) | round(0)] | min | int }}

  # --- AdGuard Home: fortlaufende Zaehler fuer Tageswerte und Verlauf ---
  # Die AdGuard-Sensoren zaehlen ueber ein gleitendes 24-h-Fenster und haben keine
  # state_class. Diese Zaehler addieren nur Zuwaechse, fallen also nie zurueck, und HA
  # fuehrt fuer sie Langzeitstatistik (Grundlage fuer Stunden/Tage/Monate im Dashboard).
  # Wirft AdGuard zur vollen Stunde eine alte Stunde aus dem Fenster, faellt der Zuwachs
  # dieses einen Abfrage-Intervalls weg (vernachlaessigbar).
  - trigger:
      - trigger: state
        entity_id: sensor.adguard_home_blockierte_dns_abfragen
    sensor:
      - name: "AdGuard blockiert gesamt"
        unique_id: adguard_blockiert_gesamt
        unit_of_measurement: "Abfragen"
        state_class: total_increasing
        icon: mdi:shield-check
        state: >-
          {% set alt = trigger.from_state.state | float(none) if trigger.from_state else none %}
          {% set neu = trigger.to_state.state | float(none) %}
          {% set basis = this.state | float(0) %}
          {{ (basis + neu - alt) | int if alt is not none and neu is not none and neu > alt else basis | int }}
  - trigger:
      - trigger: state
        entity_id: sensor.adguard_home_dns_abfragen
    sensor:
      - name: "AdGuard Abfragen gesamt"
        unique_id: adguard_abfragen_gesamt
        unit_of_measurement: "Abfragen"
        state_class: total_increasing
        icon: mdi:dns
        state: >-
          {% set alt = trigger.from_state.state | float(none) if trigger.from_state else none %}
          {% set neu = trigger.to_state.state | float(none) %}
          {% set basis = this.state | float(0) %}
          {{ (basis + neu - alt) | int if alt is not none and neu is not none and neu > alt else basis | int }}

  # --- Netzwerk-Tab: Fritz!Box-Kennzahlen in lesbaren Einheiten ---
  - sensor:
      - name: "Geräte im Netz"
        unique_id: netzwerk_geraete_im_netz
        unit_of_measurement: "Geräte"
        state_class: measurement
        icon: mdi:devices
        state: >-
          {{ integration_entities('fritz') | select('match', 'device_tracker\.')
             | select('is_state', 'home') | list | count }}
        attributes:
          bekannt: >-
            {{ integration_entities('fritz') | select('match', 'device_tracker\.') | list | count }}
      - name: "Internet Download jetzt"
        unique_id: netzwerk_download_jetzt
        unit_of_measurement: "Mbit/s"
        state_class: measurement
        icon: mdi:download-network
        availability: "{{ has_value('sensor.fritz_box_7590_download_durchsatz') }}"
        state: "{{ (states('sensor.fritz_box_7590_download_durchsatz') | float(0) * 8 / 1000) | round(1) }}"
      - name: "Internet Upload jetzt"
        unique_id: netzwerk_upload_jetzt
        unit_of_measurement: "Mbit/s"
        state_class: measurement
        icon: mdi:upload-network
        availability: "{{ has_value('sensor.fritz_box_7590_upload_durchsatz') }}"
        state: "{{ (states('sensor.fritz_box_7590_upload_durchsatz') | float(0) * 8 / 1000) | round(1) }}"

  # --- Luftfeuchte: Raeume ab 65 % (Schimmelgefahr), Werte aus den tado-Thermostaten ---
  - binary_sensor:
      - name: "Lüften empfohlen"
        unique_id: lueften_empfohlen
        icon: mdi:window-open-variant
        state: >-
            {% set raeume = {
              'Wohnzimmer': ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'],
              'Schlafzimmer': ['sensor.schlafzimmer_heizung_schlafzimmer_links_current_humidity',
                               'sensor.schlafzimmer_heizung_schlafzimmer_rechts_current_humidity'],
              'Esszimmer': ['sensor.esszimmer_heizung_esszimmer_current_humidity'],
              'Büro': ['sensor.buro_heizung_buro_current_humidity'],
              'Küche': ['sensor.kuche_heizung_kuche_current_humidity'],
              'Bad': ['sensor.bad_heizung_bad_current_humidity'] } %}
            {% set ns = namespace(r=[]) %}
            {% for raum, ids in raeume.items() %}
              {% set h = ids | map('states') | map('float', none) | select('number') | list %}
              {% if h and h | sum / h | count >= 65 %}
                {% set ns.r = ns.r + [raum ~ ' ' ~ (h | sum / h | count) | round(0) | int ~ ' %'] %}
              {% endif %}
            {% endfor %}
            {{ ns.r | count > 0 }}
        attributes:
          raeume: >-
            {% set raeume = {
              'Wohnzimmer': ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'],
              'Schlafzimmer': ['sensor.schlafzimmer_heizung_schlafzimmer_links_current_humidity',
                               'sensor.schlafzimmer_heizung_schlafzimmer_rechts_current_humidity'],
              'Esszimmer': ['sensor.esszimmer_heizung_esszimmer_current_humidity'],
              'Büro': ['sensor.buro_heizung_buro_current_humidity'],
              'Küche': ['sensor.kuche_heizung_kuche_current_humidity'],
              'Bad': ['sensor.bad_heizung_bad_current_humidity'] } %}
            {% set ns = namespace(r=[]) %}
            {% for raum, ids in raeume.items() %}
              {% set h = ids | map('states') | map('float', none) | select('number') | list %}
              {% if h and h | sum / h | count >= 65 %}
                {% set ns.r = ns.r + [raum ~ ' ' ~ (h | sum / h | count) | round(0) | int ~ ' %'] %}
              {% endif %}
            {% endfor %}
            {{ ns.r }}

  # --- Stromkosten der gemessenen Geraete (Energie-Dashboard), Preis in input_number.strompreis ---
  - sensor:
      - name: "Strom Geräte gesamt"
        unique_id: strom_geraete_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:lightning-bolt
        # nur wenn alle Zaehler da sind, sonst springt die Summe und die Tageszaehler zaehlen falsch
        availability: >-
          {{ ['sensor.tz3210_2putqrmw_ts011f_summe_verbraucht', 'sensor.keller_steckdose_trockner_summe_verbraucht',
              'sensor.steckdose_geschirrspuler_summe_verbraucht', 'sensor.waschmaschine_summe_verbraucht',
              'sensor.hue_licht_energy'] | map('states') | map('is_number') | min }}
        state: >-
          {{ (['sensor.tz3210_2putqrmw_ts011f_summe_verbraucht', 'sensor.keller_steckdose_trockner_summe_verbraucht',
               'sensor.steckdose_geschirrspuler_summe_verbraucht', 'sensor.waschmaschine_summe_verbraucht',
               'sensor.hue_licht_energy'] | map('states') | map('float') | sum) | round(3) }}
      - name: "Stromkosten heute"
        unique_id: stromkosten_heute
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:currency-eur
        availability: "{{ is_number(states('sensor.strom_gerate_heute')) }}"
        state: "{{ (states('sensor.strom_gerate_heute') | float * states('input_number.strompreis') | float(0)) | round(2) }}"
      - name: "Stromkosten Monat"
        unique_id: stromkosten_monat
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        icon: mdi:currency-eur
        availability: "{{ is_number(states('sensor.strom_gerate_monat')) }}"
        state: "{{ (states('sensor.strom_gerate_monat') | float * states('input_number.strompreis') | float(0)) | round(2) }}"

utility_meter:
  strom_gerate_heute:
    name: Strom Geräte heute
    source: sensor.strom_gerate_gesamt
    cycle: daily
  strom_gerate_monat:
    name: Strom Geräte Monat
    source: sensor.strom_gerate_gesamt
    cycle: monthly
  adguard_blockiert_heute:
    name: AdGuard blockiert heute
    source: sensor.adguard_blockiert_gesamt
    cycle: daily
  adguard_abfragen_heute:
    name: AdGuard Abfragen heute
    source: sensor.adguard_abfragen_gesamt
    cycle: daily

input_number:
  strompreis:
    name: Strompreis
    min: 0
    max: 1
    step: 0.0001
    mode: box
    unit_of_measurement: "€/kWh"
    icon: mdi:cash

input_select:
  adguard_zeitraum:
    name: AdGuard Zeitraum
    options:
      - Heute
      - 7 Tage
      - 30 Tage
      - 12 Monate
    icon: mdi:calendar-range
