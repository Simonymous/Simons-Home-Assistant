# Liquid Glass - angelehnt an das iOS-26-Design.
#
# Aufbau: Karten auf oberster Ebene sind Glas (Unschaerfe + Saettigung, helle
# Lichtkante oben, weicher Schatten). Karten innerhalb eines stack-in-card sind
# keine zweite Glasschicht, sondern ruhige "Kacheln" mit kleinerem, konzentrischem
# Radius. Gesteuert wird das ueber --lg-surface-*: stack-in-card setzt sie fuer
# alles in sich auf die Kachel-Werte um (CSS-Variablen vererben durch Shadow-DOMs).
# card-mod legt diesen Stil in das Shadow-DOM jeder Karte, daher waehlt
# :host(<element>) den Kartentyp aus (Typ-Klassen setzt card-mod nicht verlaesslich).
#
# Wird pro View im Dashboard gesetzt (theme: Liquid Glass), damit es auf jedem
# Geraet gilt und nicht nur dort, wo es im Profil ausgewaehlt wurde.
Liquid Glass:
  card-mod-theme: "Liquid Glass"

  card-mod-card: |
    ha-card {
      border-radius: var(--lg-surface-radius) !important;
      background: var(--lg-surface) !important;
      border: var(--lg-surface-border) !important;
      box-shadow: var(--lg-surface-shadow) !important;
      backdrop-filter: var(--lg-surface-filter) !important;
      -webkit-backdrop-filter: var(--lg-surface-filter) !important;
    }
    :host(stack-in-card) ha-card {
      border-radius: var(--lg-glass-radius) !important;
      background: var(--lg-glass) !important;
      border: 1px solid var(--lg-glass-border) !important;
      box-shadow: var(--lg-glass-shadow) !important;
      backdrop-filter: var(--lg-glass-filter) !important;
      -webkit-backdrop-filter: var(--lg-glass-filter) !important;
      padding: 8px !important;
      --lg-surface: var(--lg-tile);
      --lg-surface-border: none;
      --lg-surface-shadow: var(--lg-tile-shadow);
      --lg-surface-filter: none;
      --lg-surface-radius: var(--lg-tile-radius);
      --vertical-stack-card-gap: 8px;
      --horizontal-stack-card-gap: 8px;
      --grid-card-gap: 8px;
      --stack-card-margin: 0;
    }
    :host(hui-heading-card) ha-card {
      background: none !important;
      box-shadow: none !important;
      border: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

  # Kopfleiste: durchscheinend wie die iOS-Navigationsleiste
  card-mod-root: |
    .header, .toolbar {
      background: var(--lg-bar) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
      box-shadow: 0 0.5px 0 var(--lg-hairline) !important;
    }

  # Grundwerte fuer Karten auf oberster Ebene (= Glas)
  lg-surface: "var(--lg-glass)"
  lg-surface-border: "1px solid var(--lg-glass-border)"
  lg-surface-shadow: "var(--lg-glass-shadow)"
  lg-surface-filter: "var(--lg-glass-filter)"
  lg-surface-radius: "var(--lg-glass-radius)"
  lg-glass-radius: "28px"
  lg-tile-radius: "20px"  # 28px Karte - 8px Innenabstand = konzentrisch
  lg-glass-filter: "blur(28px) saturate(180%)"

  # Schrift wie auf dem iPhone
  ha-font-family-body: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif'
  primary-font-family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif'
  paper-font-common-base_-_font-family: "var(--primary-font-family)"

  ha-card-border-radius: "var(--lg-surface-radius)"
  ha-card-border-width: "0px"
  ha-card-background: "var(--lg-surface)"
  ha-card-box-shadow: "none"
  # Menues, Datumswaehler und Dialoge nutzen card-background-color direkt:
  # fast deckend, damit sie lesbar bleiben (Karten bekommen ihr Glas per card-mod).
  card-background-color: "var(--lg-menu)"
  mdc-theme-surface: "var(--lg-menu)"

  # Mushroom: runde Icons, iOS-artige Regler
  mush-icon-border-radius: "50%"
  mush-control-border-radius: "14px"
  mush-card-primary-font-weight: "600"
  mush-chip-border-radius: "999px"
  mush-chip-background: "var(--lg-tile)"
  mush-rgb-white: "255, 255, 255"

  # Bubble Card (Pop-ups wie iOS-Sheets)
  bubble-pop-up-border-radius: "34px"
  bubble-pop-up-background-color: "var(--lg-sheet)"
  bubble-main-background-color: "var(--lg-tile)"
  bubble-border-radius: "20px"

  ha-dialog-border-radius: "28px"
  feature-border-radius: "14px"

  modes:
    light:
      lovelace-background: >-
        radial-gradient(ellipse at 12% 8%, #9cc3ff 0%, transparent 55%),
        radial-gradient(ellipse at 88% 18%, #ffc4dc 0%, transparent 50%),
        radial-gradient(ellipse at 30% 62%, #c9b8ff 0%, transparent 50%),
        radial-gradient(ellipse at 80% 95%, #aeeed3 0%, transparent 55%),
        #eef1f8 fixed
      lg-glass: "linear-gradient(160deg, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.38) 100%)"
      lg-glass-border: "rgba(255, 255, 255, 0.75)"
      lg-glass-shadow: >-
        0 12px 32px rgba(30, 40, 90, 0.10), 0 2px 6px rgba(30, 40, 90, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(255, 255, 255, 0.35)
      lg-tile: "rgba(255, 255, 255, 0.55)"
      lg-tile-shadow: "inset 0 0.5px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(30, 40, 90, 0.05)"
      lg-sheet: "rgba(246, 247, 252, 0.82)"
      lg-menu: "rgba(248, 249, 253, 0.97)"
      lg-bar: "rgba(248, 249, 253, 0.62)"
      lg-hairline: "rgba(60, 60, 67, 0.18)"
      primary-color: "#007AFF"
      accent-color: "#007AFF"
      primary-background-color: "#eef1f8"
