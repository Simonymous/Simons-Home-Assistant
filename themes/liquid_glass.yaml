      secondary-text-color: "rgba(60, 60, 67, 0.72)"
      disabled-text-color: "rgba(60, 60, 67, 0.35)"
      divider-color: "rgba(60, 60, 67, 0.12)"
      app-header-background-color: "rgba(248, 249, 253, 0.62)"
      app-header-text-color: "#1c1c1e"
      # iOS-Systemfarben (fuer HA- und Mushroom-Farbnamen)
      blue-color: "rgb(0, 122, 255)"
      rgb-blue-color: "0, 122, 255"
      rgb-blue: "0, 122, 255"
      green-color: "rgb(52, 199, 89)"
      rgb-green-color: "52, 199, 89"
