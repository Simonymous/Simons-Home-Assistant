title: Mein Zuhause
views:
- title: Zuhause
  path: zuhause
  icon: mdi:home
  theme: Liquid Glass
  cards:
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.fritz_box_7590_verbindung
      state: 'off'
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.fritz_box_7590_verbindung
      primary: Internet getrennt
      secondary: >-
        {% set s = states.binary_sensor.fritz_box_7590_verbindung %}
        seit {{ as_local(s.last_changed).strftime('%H:%M') if s else '?' }} Uhr · Ring, tado-App,
        Roborock und Auto-Daten sind gerade nicht aktuell. Licht, Heizung und Nuki laufen lokal weiter.
      multiline_secondary: true
      icon: mdi:web-off
      icon_color: red
      tap_action:
        action: more-info
      card_mod:
        style: |
          ha-card {
            background: rgba(255, 59, 48, 0.16) !important;
            border: 1px solid rgba(255, 59, 48, 0.45) !important;
          }
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
    - type: weather
      entity: weather.forecast_home
      show_conditions: true
      show_temperature: true
      tap_action:
        action: more-info
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.restabfall_tage_bis_abholung
        below: 2
      chip:
        type: template
        entity: sensor.restabfall_tage_bis_abholung
        icon: mdi:trash-can
        icon_color: grey
        content: "Restmüll {{ 'heute' if states('sensor.restabfall_tage_bis_abholung') | int(9) == 0 else 'morgen' }}"
        tap_action:
          action: navigate
          navigation_path: /dashboard-reinigung/erledigungen
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.biotonne_tage_bis_abholung
        below: 2
      chip:
        type: template
        entity: sensor.biotonne_tage_bis_abholung
        icon: mdi:trash-can
        icon_color: brown
        content: "Bio {{ 'heute' if states('sensor.biotonne_tage_bis_abholung') | int(9) == 0 else 'morgen' }}"
        tap_action:
          action: navigate
          navigation_path: /dashboard-reinigung/erledigungen
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.gelbe_tonne_tage_bis_abholung
        below: 2
      chip:
        type: template
        entity: sensor.gelbe_tonne_tage_bis_abholung
        icon: mdi:trash-can
        icon_color: yellow
        content: "Gelber Sack {{ 'heute' if states('sensor.gelbe_tonne_tage_bis_abholung') | int(9) == 0 else 'morgen' }}"
        tap_action:
          action: navigate
          navigation_path: /dashboard-reinigung/erledigungen
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.blaue_tonne_tage_bis_abholung
        below: 2
      chip:
        type: template
        entity: sensor.blaue_tonne_tage_bis_abholung
        icon: mdi:trash-can
        icon_color: blue
        content: "Papier {{ 'heute' if states('sensor.blaue_tonne_tage_bis_abholung') | int(9) == 0 else 'morgen' }}"
        tap_action:
          action: navigate
          navigation_path: /dashboard-reinigung/erledigungen
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.pakete_heute
        above: 0
      chip:
        type: template
        entity: sensor.pakete_heute
        icon: mdi:package-variant-closed
        icon_color: orange
        content: "{{ states('sensor.pakete_heute') }} {{ 'Paket' if states('sensor.pakete_heute') | int(0) == 1 else 'Pakete' }} heute"
        tap_action:
          action: navigate
          navigation_path: /dashboard-reinigung/erledigungen
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.waschmaschine_zustand
        state_not: ['off', 'idle', 'unknown', 'unavailable']
      chip:
        type: template
        entity: sensor.waschmaschine_zustand
        icon: mdi:washing-machine
        icon_color: "{{ 'green' if is_state('sensor.waschmaschine_zustand', 'finished') else 'blue' }}"
        content: >-
          {% set z = states('sensor.waschmaschine_zustand') %}
          {% set m = states('sensor.waschmaschine_verbleibende_zeit') | float(none) %}
          {% if z == 'finished' %}Wäsche fertig
          {% elif z == 'running' and m is not none %}Wäsche bis {{ (now() + timedelta(minutes=m)).strftime('%H:%M') }}
          {% else %}Wäsche läuft{% endif %}
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.trockner_zustand
        state_not: ['off', 'idle', 'unknown', 'unavailable']
      chip:
        type: template
        entity: sensor.trockner_zustand
        icon: mdi:tumble-dryer
        icon_color: "{{ 'green' if is_state('sensor.trockner_zustand', 'finished') else 'blue' }}"
        content: >-
          {% set z = states('sensor.trockner_zustand') %}
          {% set m = states('sensor.trockner_verbleibende_zeit') | float(none) %}
          {% if z == 'finished' %}Trockner fertig
          {% elif z == 'running' and m is not none %}Trockner bis {{ (now() + timedelta(minutes=m)).strftime('%H:%M') }}
          {% else %}Trockner läuft{% endif %}
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.spulmaschine_zustand
        state_not: ['off', 'idle', 'unknown', 'unavailable']
      chip:
        type: template
        entity: sensor.spulmaschine_zustand
        icon: mdi:dishwasher
        icon_color: "{{ 'green' if is_state('sensor.spulmaschine_zustand', 'finished') else 'blue' }}"
        content: >-
          {% set z = states('sensor.spulmaschine_zustand') %}
          {% set m = states('sensor.spulmaschine_verbleibende_zeit') | float(none) %}
          {% if z == 'finished' %}Spüler fertig
          {% elif z == 'running' and m is not none %}Spüler bis {{ (now() + timedelta(minutes=m)).strftime('%H:%M') }}
          {% else %}Spüler läuft{% endif %}
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.luften_empfohlen
        state: 'on'
      chip:
        type: template
        entity: binary_sensor.luften_empfohlen
        icon: mdi:water-alert
        icon_color: blue
        content: "Lüften: {{ (state_attr('binary_sensor.luften_empfohlen', 'raeume') or []) | join(', ') }}"
        tap_action:
          action: more-info
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: todo.couple
        above: 0
      chip:
        type: template
        entity: todo.couple
        icon: mdi:cart
        icon_color: green
        content: "{{ states('todo.couple') }} auf der Liste"
        tap_action:
          action: navigate
          navigation_path: /dashboard-reinigung/erledigungen
    - type: template
      entity: sensor.stromkosten_heute
      icon: mdi:lightning-bolt
      icon_color: amber
      content: >-
        {% if states('input_number.strompreis') | float(0) == 0 %}Strompreis eintragen
        {% else %}{{ '%.2f' | format(states('sensor.stromkosten_heute') | float(0)) | replace('.', ',') }} € Strom heute{% endif %}
      tap_action:
        action: navigate
        navigation_path: /dashboard-reinigung/energie
  - type: custom:stack-in-card
    cards:
    - type: heading
      heading: Anwesenheit
      heading_style: title
      icon: mdi:account-multiple
      card_mod: &heading_card_mod
        style: |
          ha-card {
            display: flex !important;
            align-items: center;
            gap: 10px;
            padding: 12px 20px !important;
            margin-bottom: 4px;
          }
          ha-card ha-state-icon, ha-card ha-icon {
            color: var(--primary-color);
            --mdc-icon-size: 22px;
          }
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-person-card
        entity: person.simonymous
        name: Simon
        layout: vertical
        use_entity_picture: true
      - type: custom:mushroom-person-card
        entity: person.madeleine
        name: Madeleine
        layout: vertical
        use_entity_picture: true
  - type: custom:stack-in-card
    cards:
    - type: heading
      heading: Eingang
      heading_style: title
      icon: mdi:door
      tap_action:
        action: navigate
        navigation_path: /config/areas/area/flur
      card_mod: *heading_card_mod
    - type: custom:mushroom-template-card
      entity: sensor.flur_bewegungsmelder_flur_temperatur
      tap_action:
        action: more-info
      primary: >-
        {% set t = states('sensor.flur_bewegungsmelder_flur_temperatur') %}
        {% if t in ['unavailable', 'unknown', 'none', ''] %}Nicht erreichbar{% else %}{{ t }} °C{% endif %}
      secondary: Temperatur am Eingang
      icon: >-
        {% set t = states('sensor.flur_bewegungsmelder_flur_temperatur') %}
        {{ 'mdi:thermometer-off' if t in ['unavailable', 'unknown', 'none', ''] else 'mdi:thermometer' }}
      icon_color: >-
        {% set t = states('sensor.flur_bewegungsmelder_flur_temperatur') %}
        {% if t in ['unavailable', 'unknown', 'none', ''] %}grey{% else %}
        {% set tf = t | float(0) %}
        {% if tf >= 23 %}orange{% elif tf <= 19 %}blue{% else %}green{% endif %}
        {% endif %}
      layout: horizontal
    - type: custom:mushroom-light-card
      entity: light.flur_flur
      name: Decke
      icon: mdi:ceiling-light
      layout: horizontal
      show_brightness_control: true
      use_light_color: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
    - type: custom:button-card
      entity: binary_sensor.flur_bewegungsmelder_flur_bewegung
      name: Letzte Bewegung
      icon: mdi:motion-sensor
      show_name: true
      show_state: false
      show_label: true
      show_icon: true
      tap_action:
        action: more-info
      label: "[[[\n  const st = states['binary_sensor.flur_bewegungsmelder_flur_bewegung'];\n  const state = st ? st.state : 'unknown';\n  if (state === 'on') return 'Bewegung erkannt';\n  const last = states['input_datetime.letzte_bewegung_flur'];\n  if (last && last.state) {\n    const m = last.state.match(/^(\\d{4})-(\\d{2})-(\\d{2}) (\\d{2}):(\\d{2})/);\n    if (m) return 'Zuletzt: ' + m[3] + '.' + m[2] + '. um ' + m[4] + ':' + m[5];\n  }\n  return 'Keine Bewegung erkannt';\n]]]"
      styles:
        card:
        - padding: 12px
        - min-height: 66px
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 42px 1fr
        - grid-template-rows: min-content min-content
        icon:
        - width: 24px
        - height: 24px
        name:
        - justify-self: start
        - font-weight: bold
        - font-size: 14px
        label:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
        - white-space: normal
      state:
      - value: 'on'
        color: var(--amber-color)
        styles:
          icon:
          - animation: machine-blink 1.2s ease-in-out infinite
      - operator: default
        color: var(--disabled-text-color)
      extra_styles: '@keyframes machine-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }'
    - type: custom:button-card
      entity: button.vordereingang_tur_offnen
      name: Haustür öffnen
      icon: mdi:door-open
      show_name: true
      show_state: false
      show_label: true
      show_icon: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.vordereingang_tur_offnen
      label: "[[[\n  const st = states['button.vordereingang_tur_offnen'];\n  if (!st || !st.state || ['unknown','unavailable'].includes(st.state)) return 'Noch nie geöffnet';\n  const d = new Date(st.state);\n  if (isNaN(d.getTime())) return 'Noch nie geöffnet';\n  const dd = String(d.getDate()).padStart(2,'0');\n  const mm = String(d.getMonth()+1).padStart(2,'0');\n  const hh = String(d.getHours()).padStart(2,'0');\n  const mi = String(d.getMinutes()).padStart(2,'0');\n  return 'Zuletzt geöffnet: ' + dd + '.' + mm + '. um ' + hh + ':' + mi;\n]]]"
      styles:
        card:
        - padding: 12px
        - min-height: 66px
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 42px 1fr
        - grid-template-rows: min-content min-content
        icon:
        - width: 24px
        - height: 24px
        - color: '#0A84FF'
        name:
        - justify-self: start
        - font-weight: bold
        - font-size: 14px
        label:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
        - white-space: normal
    - type: custom:button-card
      entity: lock.smart_lock_pro
      name: Wohnungsschloss
      show_name: true
      show_state: false
      show_label: true
      show_icon: true
      tap_action:
        action: toggle
      label: "[[[\n  const st = states['lock.smart_lock_pro'];\n  const state = st ? st.state : 'unknown';\n  const labels = {locked:'Abgeschlossen', unlocked:'Aufgeschlossen', locking:'Schließt ab…', unlocking:'Schließt auf…', jammed:'Blockiert!'};\n  const base = labels[state] || 'Unbekannt';\n  const last = states['input_datetime.letztes_aufschliessen_wohnung'];\n  if (last && last.state) {\n    const m = last.state.match(/^(\\d{4})-(\\d{2})-(\\d{2}) (\\d{2}):(\\d{2})/);\n    if (m) return base + ' · zuletzt auf: ' + m[3] + '.' + m[2] + '. um ' + m[4] + ':' + m[5];\n  }\n  return base;\n]]]"
      styles:
        card:
        - padding: 12px
        - min-height: 66px
        grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 42px 1fr
        - grid-template-rows: min-content min-content
        icon:
        - width: 24px
        - height: 24px
        name:
        - justify-self: start
        - font-weight: bold
        - font-size: 14px
        label:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
        - white-space: normal
      state:
      - value: locked
        icon: mdi:lock
        color: var(--green-color)
      - value: unlocked
        icon: mdi:lock-open-variant
        color: var(--orange-color)
        styles:
          icon:
          - animation: machine-blink 1.2s ease-in-out infinite
      - value: locking
        icon: mdi:lock-clock
        color: var(--blue-color)
      - value: unlocking
        icon: mdi:lock-clock
        color: var(--blue-color)
      - value: jammed
        icon: mdi:lock-alert
        color: var(--red-color)
        styles:
          icon:
          - animation: machine-blink 0.8s ease-in-out infinite
      - operator: default
        icon: mdi:lock-question
        color: var(--grey-color)
      extra_styles: '@keyframes machine-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }'
  - type: custom:stack-in-card
    cards:
    - type: heading
      heading: Wohnzimmer
      heading_style: title
      icon: mdi:sofa
      tap_action:
        action: navigate
        navigation_path: /config/areas/area/wohnzimmer
      card_mod: *heading_card_mod
    - type: custom:mushroom-template-card
      entity: climate.wohnzimmer_heizung_wohnzimmer
      tap_action:
        action: more-info
      primary: >-
        {% set c = expand(['climate.wohnzimmer_heizung_wohnzimmer']) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ist = c | map(attribute='attributes.current_temperature') | select('number') | list %}
        {% set soll = c | selectattr('state', 'eq', 'heat') | map(attribute='attributes.temperature') | select('number') | list %}
        {% set heizt = c | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
        {% set aus = c | count > 0 and c | selectattr('state', 'eq', 'off') | list | count == c | count %}
        {% set h = ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'] | map('states') | map('float', none) | select('number') | list %}
        {% if ist %}{{ (ist | sum / ist | count) | round(1) }} °C{% else %}Nicht erreichbar{% endif %}
      secondary: >-
        {% set c = expand(['climate.wohnzimmer_heizung_wohnzimmer']) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ist = c | map(attribute='attributes.current_temperature') | select('number') | list %}
        {% set soll = c | selectattr('state', 'eq', 'heat') | map(attribute='attributes.temperature') | select('number') | list %}
        {% set heizt = c | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
        {% set aus = c | count > 0 and c | selectattr('state', 'eq', 'off') | list | count == c | count %}
        {% set h = ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'] | map('states') | map('float', none) | select('number') | list %}
        {% set hv = (h | sum / h | count) | round(0) | int if h else none %}
        {% set f = hv ~ ' %' ~ (' lüften' if hv >= 65 else (' trocken' if hv < 35 else '')) if hv is not none else '' %}
        {% if not c %}Thermostat offline
        {% elif aus %}Heizung aus{{ ' · ' ~ f if f }}
        {% elif heizt %}heizt auf {{ soll | max }} °C{{ ' · ' ~ f if f }}
        {% else %}Soll {{ soll | max if soll else '–' }} °C{{ ' · ' ~ f if f }}{% endif %}
      icon: >-
        {% set c = expand(['climate.wohnzimmer_heizung_wohnzimmer']) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ist = c | map(attribute='attributes.current_temperature') | select('number') | list %}
        {% set soll = c | selectattr('state', 'eq', 'heat') | map(attribute='attributes.temperature') | select('number') | list %}
        {% set heizt = c | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
        {% set aus = c | count > 0 and c | selectattr('state', 'eq', 'off') | list | count == c | count %}
        {% set h = ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'] | map('states') | map('float', none) | select('number') | list %}
        {% if not ist %}mdi:thermometer-off{% elif heizt %}mdi:radiator{% elif aus %}mdi:radiator-off{% else %}mdi:thermometer{% endif %}
      icon_color: >-
        {% set c = expand(['climate.wohnzimmer_heizung_wohnzimmer']) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ist = c | map(attribute='attributes.current_temperature') | select('number') | list %}
        {% set soll = c | selectattr('state', 'eq', 'heat') | map(attribute='attributes.temperature') | select('number') | list %}
        {% set heizt = c | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
        {% set aus = c | count > 0 and c | selectattr('state', 'eq', 'off') | list | count == c | count %}
        {% set h = ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'] | map('states') | map('float', none) | select('number') | list %}
        {% if not ist or aus %}grey{% elif heizt %}orange
        {% elif soll and (ist | sum / ist | count) | round(1) < (soll | max) - 0.5 %}blue{% else %}green{% endif %}
      badge_icon: >-
        {% set c = expand(['climate.wohnzimmer_heizung_wohnzimmer']) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ist = c | map(attribute='attributes.current_temperature') | select('number') | list %}
        {% set soll = c | selectattr('state', 'eq', 'heat') | map(attribute='attributes.temperature') | select('number') | list %}
        {% set heizt = c | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
        {% set aus = c | count > 0 and c | selectattr('state', 'eq', 'off') | list | count == c | count %}
        {% set h = ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'] | map('states') | map('float', none) | select('number') | list %}
        {{ 'mdi:fire' if heizt else ('mdi:water-alert' if h and h | sum / h | count >= 65 else '') }}
      badge_color: >-
        {% set c = expand(['climate.wohnzimmer_heizung_wohnzimmer']) | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
        {% set ist = c | map(attribute='attributes.current_temperature') | select('number') | list %}
        {% set soll = c | selectattr('state', 'eq', 'heat') | map(attribute='attributes.temperature') | select('number') | list %}
        {% set heizt = c | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
        {% set aus = c | count > 0 and c | selectattr('state', 'eq', 'off') | list | count == c | count %}
        {% set h = ['sensor.wohnzimmer_heizung_wohnzimmer_current_humidity'] | map('states') | map('float', none) | select('number') | list %}
        {{ 'orange' if heizt else 'blue' }}
      layout: horizontal
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-light-card
        entity: light.wohnzimmer_wohnzimmer
        name: Decke
        icon: mdi:ceiling-light
        layout: vertical
        show_brightness_control: true
        use_light_color: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: switch.wohnzimmer_wohnwand_outlet
        primary: Wohnwand
        secondary: "{{ 'An' if is_state('switch.wohnzimmer_wohnwand_outlet', 'on') else 'Aus' }}"
        icon: mdi:sofa-outline
        icon_color: "{{ 'amber' if is_state('switch.wohnzimmer_wohnwand_outlet', 'on') else 'grey' }}"
        layout: vertical
        tap_action:
          action: perform-action
          perform_action: switch.toggle
          target:
            entity_id: switch.wohnzimmer_wohnwand_outlet
        hold_action:
          action: more-info
    - type: conditional
      conditions:
      - condition: state
        entity: media_player.wohnzimmer_appletv_wohnzimmer_appletv
        state: playing
      card:
        type: custom:mushroom-media-player-card
        entity: media_player.wohnzimmer_appletv_wohnzimmer_appletv
        use_media_info: true
        show_volume_level: false
        icon: >-
          {% set app = state_attr('media_player.wohnzimmer_appletv_wohnzimmer_appletv', 'app_id') %}
          {% if app == 'com.netflix.Netflix' %}mdi:netflix
          {% elif app == 'com.google.ios.youtube' %}mdi:youtube
          {% elif app in ['com.amazon.aiv.AIVApp', 'com.amazon.Lounge'] %}mdi:amazon
          {% elif app == 'com.disney.disneyplus' %}mdi:disney-plus
          {% elif app == 'com.spotify.client' %}mdi:spotify
          {% elif app == 'com.plexapp.plex' %}mdi:plex
          {% elif app == 'com.apple.TVWatchList' %}mdi:apple
          {% else %}mdi:apple-tv
          {% endif %}
        icon_color: >-
          {% set app = state_attr('media_player.wohnzimmer_appletv_wohnzimmer_appletv', 'app_id') %}
          {% if app == 'com.netflix.Netflix' %}#E50914
          {% elif app == 'com.google.ios.youtube' %}#FF0000
          {% elif app in ['com.amazon.aiv.AIVApp', 'com.amazon.Lounge'] %}#00A8E1
          {% elif app == 'com.disney.disneyplus' %}#113CCF
          {% elif app == 'com.spotify.client' %}#1DB954
          {% elif app == 'com.plexapp.plex' %}#E5A00D
          {% else %}white
          {% endif %}
    - type: conditional
      conditions:
      - condition: state
