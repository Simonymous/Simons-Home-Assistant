        show_state: true
        show_icon: true
      alignment: center
    range_info:
    - energy_level:
        entity: sensor.byd_seal_u_dm_i_ladezustand
        icon: mdi:battery
        value_position: inside
        tap_action:
          action: more-info
      charging_entity: binary_sensor.byd_seal_u_dm_i_laden
      progress_color: '#4caf50'
      bar_height: 16
      bar_radius: 8
    - energy_level:
        entity: sensor.byd_seal_u_dm_i_kraftstofffullstand
        icon: mdi:gas-station
        value_position: inside
      progress_color: '#ff9800'
      bar_height: 16
      bar_radius: 8
    button_cards:
    - name: Klimaanlage
      entity: climate.byd_seal_u_dm_i_klima
      icon: mdi:air-conditioner
      button_type: action
      tap_action:
        action: more-info
    - name: Innenraum
      entity: sensor.byd_seal_u_dm_i_innenraumtemperatur
      icon: mdi:thermometer
      button_type: action
      tap_action:
        action: more-info
    - name: Außen
      entity: sensor.byd_seal_u_dm_i_aussentemperatur
      icon: mdi:thermometer
      button_type: action
      tap_action:
        action: more-info
    - name: Kilometerstand
      entity: sensor.byd_seal_u_dm_i_kilometerzahler
      icon: mdi:counter
      button_type: action
      tap_action:
        action: more-info
    - name: Daten aktualisieren
