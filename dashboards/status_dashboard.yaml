- title: Roborock
  path: roborock
  icon: mdi:robot-vacuum
  theme: Liquid Glass
  cards:
  - type: custom:stack-in-card
    cards:
    - type: heading
      heading: Bob
      heading_style: title
      icon: mdi:robot-vacuum
      card_mod: *heading_card_mod
    - type: custom:neonplan-follow-card
      room_entity: sensor.bob_aktueller_raum
      active_entity: vacuum.bob
      active_states:
      - cleaning
      - paused
      room_aliases:
        Arbeitszimmer: Büro
      card:
        type: custom:neonplan3d-card
        height: 380
        controls_hidden: true
        room_panel: false
    - type: custom:button-card
      entity: sensor.bob_reinigungsstatus
      icon: mdi:robot-vacuum
      show_name: true
      show_state: false
      show_label: true
      name: "[[[ return entity ? entity.state : 'Bob'; ]]]"
      label: |-
        [[[
          const status = states['sensor.bob_status']?.state;
          const aktiv = ['cleaning', 'segment_cleaning', 'zoned_cleaning', 'spot_cleaning', 'paused'].includes(status);
          if (!aktiv) {
            const ende = states['sensor.bob_letztes_reinigungsende']?.state;
            const d = ende ? new Date(ende) : null;
            return d && !isNaN(d)
              ? 'Letzte Reinigung: ' + d.toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
              : 'Noch keine Reinigung';
          }
          const flaeche = parseFloat(states['sensor.bob_reinigungsbereich']?.state);
          const m2 = isNaN(flaeche) ? '' : ' · ' + flaeche.toLocaleString('de-DE') + ' m²';
          const p = states['sensor.bob_reinigungsfortschritt']?.state;
          return isNaN(parseFloat(p)) ? 'Gezielte Reinigung' + m2 : 'Werktagslauf · ' + p + ' %' + m2;
        ]]]
      custom_fields:
        bar: |-
          [[[
            const p = parseFloat(states['sensor.bob_reinigungsfortschritt']?.state);
            if (isNaN(p)) return '';
            return '<div style="height:6px;border-radius:3px;background:rgba(127,127,127,0.22);overflow:hidden">'
              + '<div style="height:100%;width:' + p + '%;border-radius:3px;background:var(--blue-color);transition:width 0.6s ease"></div></div>';
          ]]]
      tap_action:
        action: more-info
        entity: vacuum.bob
      styles:
        card:
        - padding: 12px 14px
        grid:
        - grid-template-areas: '"i n" "i l" "bar bar"'
        - grid-template-columns: 42px 1fr
        - grid-template-rows: min-content min-content min-content
        - row-gap: 2px
        name:
        - justify-self: start
        - font-weight: bold
        - font-size: 15px
        label:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
        custom_fields:
          bar:
          - margin-top: 8px
      state:
      - operator: template
        value: "[[[ return ['cleaning', 'segment_cleaning', 'zoned_cleaning', 'spot_cleaning'].includes(states['sensor.bob_status']?.state); ]]]"
        color: var(--blue-color)
        styles:
          icon:
