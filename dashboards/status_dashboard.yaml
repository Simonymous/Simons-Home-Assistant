      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.byd_seal_u_dm_i_abfrage_erzwingen
    mini_map:
      device_tracker: device_tracker.byd_seal_u_dm_i_standort
      map_zoom: 14
    layout_config:
      button_grid:
        rows: 3
        columns: 2
      range_info_config:
        layout: row
      section_order:
      - images
      - range_info
      - indicators
      - buttons
      - mini_map
